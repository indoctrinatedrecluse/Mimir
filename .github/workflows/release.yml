name: Release Mimir Desktop & Mobile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend HUD (React 19 + Vite)
        run: npm run build:ui

      - name: Build Native Rust Core (Release)
        run: cargo build --release --manifest-path src-rust/Cargo.toml --bin mimir-core

      - name: Prepare Release Artifacts
        id: package
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($TAG) -or -not $TAG.StartsWith("v")) { $TAG = "v0.9.0" }

          # Download official Microsoft WebView2 Evergreen Bootstrapper for dependency-free distribution
          Write-Host "Downloading Microsoft Edge WebView2 Evergreen Bootstrapper..."
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          
          # 1. Create Portable Directory Structure
          $PORTABLE_DIR = "mimir-portable"
          New-Item -ItemType Directory -Path $PORTABLE_DIR -Force
          Copy-Item -Path "src-rust/target/release/mimir-core.exe" -Destination "$PORTABLE_DIR/mimir.exe"
          Copy-Item -Path "dist" -Destination "$PORTABLE_DIR/dist" -Recurse
          Copy-Item -Path "MicrosoftEdgeWebview2Setup.exe" -Destination "$PORTABLE_DIR/"
          Copy-Item -Path "mimir.ico" -Destination "$PORTABLE_DIR/"
          Copy-Item -Path "LICENSE" -Destination "$PORTABLE_DIR/"
          Copy-Item -Path "README.md" -Destination "$PORTABLE_DIR/"

          # 2. Package Portable Zip
          $PORTABLE_ZIP = "mimir-$TAG-windows-x64-portable.zip"
          Compress-Archive -Path "$PORTABLE_DIR/*" -DestinationPath $PORTABLE_ZIP -Force
          Write-Host "Created portable archive: $PORTABLE_ZIP"

          # 3. Package Mythic Windows Installer via Native Rust Engine
          $SETUP_EXE = "mimir-$TAG-windows-x64-setup.exe"
          
          Write-Host "Preparing embedded payload for Mythic Installer..."
          Copy-Item -Path $PORTABLE_ZIP -Destination "src-rust/payload.zip" -Force
          
          Write-Host "Compiling Mythic Mímir Installer..."
          cargo build --release --manifest-path src-rust/Cargo.toml --bin mimir-installer
          
          Copy-Item -Path "src-rust/target/release/mimir-installer.exe" -Destination $SETUP_EXE -Force

          if (-not (Test-Path $SETUP_EXE)) {
            throw "Installer $SETUP_EXE was not generated!"
          }
          Write-Host "Created setup installer: $SETUP_EXE"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            mimir-*-windows-x64-portable.zip
            mimir-*-windows-x64-setup.exe

  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Android Web Assets
        run: npm run build:android

      - name: Build APK with Gradle
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace

      - name: Package Android APK Artifact
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" || "$TAG" != v* ]]; then TAG="v0.9.0"; fi
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="mimir-$TAG-android-mobile.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "Successfully prepared $APK_DEST"
          else
            echo "Error: $APK_SRC not found!"
            exit 1
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: mimir-*-android-mobile.apk

  publish-release:
    name: Publish Sovereign Multiplatform Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: release-dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: release-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mímir Browser ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/mimir-*-windows-x64-portable.zip
            release-dist/mimir-*-windows-x64-setup.exe
            release-dist/mimir-*-android-mobile.apk
            mimir-cinematic-realm-pack.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
