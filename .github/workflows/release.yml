name: Release Mimir Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS (Installer Compiler)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend HUD (React 19 + Vite)
        run: npm run build:ui

      - name: Build Native Rust Core (Release)
        run: cargo build --release --manifest-path src-rust/Cargo.toml

      - name: Prepare Release Artifacts
        id: package
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($TAG)) { $TAG = "v0.1.0-alpha" }

          # Download official Microsoft WebView2 Evergreen Bootstrapper for dependency-free distribution
          Write-Host "Downloading Microsoft Edge WebView2 Evergreen Bootstrapper..."
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          
          # 1. Create Portable Directory Structure
          $PORTABLE_DIR = "mimir-portable"
          New-Item -ItemType Directory -Path $PORTABLE_DIR -Force
          Copy-Item -Path "src-rust/target/release/mimir-core.exe" -Destination "$PORTABLE_DIR/mimir.exe"
          Copy-Item -Path "dist" -Destination "$PORTABLE_DIR/dist" -Recurse
          Copy-Item -Path "MicrosoftEdgeWebview2Setup.exe" -Destination "$PORTABLE_DIR/"
          Copy-Item -Path "LICENSE" -Destination "$PORTABLE_DIR/"
          Copy-Item -Path "README.md" -Destination "$PORTABLE_DIR/"

          # 2. Package Portable Zip
          $PORTABLE_ZIP = "mimir-$TAG-windows-x64-portable.zip"
          Compress-Archive -Path "$PORTABLE_DIR/*" -DestinationPath $PORTABLE_ZIP -Force
          Write-Host "Created portable archive: $PORTABLE_ZIP"

          # 3. Package Windows Installer via NSIS
          $SETUP_EXE = "mimir-$TAG-windows-x64-setup.exe"
          
          # Find makensis executable
          $MAKENSIS_CMD = "makensis"
          if (-not (Get-Command "makensis" -ErrorAction SilentlyContinue)) {
            $MAKENSIS_CMD = "C:\Program Files (x86)\NSIS\makensis.exe"
          }

          Write-Host "Compiling installer using: $MAKENSIS_CMD"
          & $MAKENSIS_CMD .github/installer.nsi

          if (Test-Path "mimir-setup.exe") {
            Move-Item -Path "mimir-setup.exe" -Destination $SETUP_EXE -Force
          } elseif (Test-Path ".github/mimir-setup.exe") {
            Move-Item -Path ".github/mimir-setup.exe" -Destination $SETUP_EXE -Force
          }

          if (-not (Test-Path $SETUP_EXE)) {
            throw "Installer $SETUP_EXE was not generated!"
          }
          Write-Host "Created setup installer: $SETUP_EXE"

          # Export output variables for GitHub release step
          echo "portable_zip=$PORTABLE_ZIP" >> $env:GITHUB_OUTPUT
          echo "setup_exe=$SETUP_EXE" >> $env:GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mímir Browser ${{ steps.package.outputs.tag_name }} (Alpha)"
          tag_name: ${{ steps.package.outputs.tag_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            mimir-*-windows-x64-portable.zip
            mimir-*-windows-x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
