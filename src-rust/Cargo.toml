[package]
name = "mimir-core"
version = "0.6.0"
edition = "2021"
authors = ["indoctrinatedrecluse"]
description = "Native Rust core and WebView2 orchestration engine for Mímir Browser"

[dependencies]
wry = { version = "0.47", features = ["devtools"] }
tao = { version = "0.30", features = ["rwh_06"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
raw-window-handle = "0.6"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }
futures = "0.3"
librqbit = "9.0"
anyhow = "1.0"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

